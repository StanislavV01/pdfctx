[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdfctx"
version = "0.1.0"
description = "PDF retrieval for AI agents: structure-aware, table-first, citable to the page and box, measured on FinanceBench."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stanislav Verbytskyi" }]
keywords = ["rag", "pdf", "mcp", "llm", "agents", "retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pdfplumber>=0.11",
  "pypdf>=5",
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
pdfctx = "pdfctx.cli:main"

[project.urls]
Repository = "https://github.com/StanislavV01/pdfctx"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfctx"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
